name: Feature Request
description: Suggest a new feature for any 0softwaredevelopment0 project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve one of our projects? We'd love to hear it!

  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which project is this feature for?
      options:
        - RustLauncher
        - SoundPad
        - IpParser
        - UltraMonitor
        - DirectMessages
        - OrganizationWebsite
        - UltimateImprovments
        - IISViewer
        - CubixSMP
        - ShiftBypass
        - PingSpoof
        - NPPsim
        - Other / General
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: "I would like to see..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or mockups.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this is not a duplicate.
          required: true
